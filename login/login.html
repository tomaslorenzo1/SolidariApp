<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — SolidariApp</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css" />
  <script defer src="login.js"></script>
</head>
<body>
  <header class="topbar">
    <img src="img/logo_header.png" alt="SolidariApp" class="brand-logo">
    <div class="brand-name"><a href="../index/index.html">SolidariApp</a></div>
  </header>

  <main class="main-area">
    <section class="card">
      <div id="alertBox" class="alert hidden"></div>

      <h2 class="card-title">"<u>Iniciar sesión</u>"</h2>

      <form id="loginForm" action="login.php" method="POST" novalidate>
        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" required placeholder="tucorreo@dominio.com" />

        <label for="password">Contraseña</label>
        <div class="password-container">
          <input id="password" name="password" type="password" required placeholder="Contraseña" autocomplete="current-password" />
          <img id="toggleIcon" src="img/eye_closed.png" alt="Mostrar" class="eye-icon" />
        </div>

        <button type="submit" class="btn">Ingresar</button>
      </form>

      <div class="links">
        <p>¿No tenés cuenta? <a href="../registro/registro.html">Crear</a></p>
        <p><a href="../recuperar/recuperar.html">¿Olvidaste tu contraseña?</a></p>
      </div>
    </section>
  </main>

  <!-- Muestra errores pasados por GET ?err=... -->
  <script>
    (function(){
      const params = new URLSearchParams(window.location.search);
      const err = params.get('err');
      if (err) {
        const box = document.getElementById('alertBox');
        box.textContent = decodeURIComponent(err);
        box.classList.remove('hidden');
        box.classList.add('error');
        box.classList.add('shake');
        setTimeout(()=>box.classList.remove('shake'),600);
      }
    })();
  </script>
</body>
</html>
